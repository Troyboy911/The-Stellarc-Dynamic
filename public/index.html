<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stellarc Dynamic Chat</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; display: flex; height: 100vh; }
    .sidebar { width: 260px; border-right: 1px solid #ccc; padding: 12px; box-sizing: border-box; }
    .main { flex: 1; display: flex; flex-direction: column; }
    .header { padding: 12px; border-bottom: 1px solid #ccc; font-weight: 600; }
    .chat { flex: 1; padding: 12px; overflow: auto; }
    .msg { margin: 8px 0; }
    .msg.you { text-align: right; }
    .msg .bubble { display: inline-block; max-width: 70%; padding: 8px 10px; border-radius: 8px; }
    .msg.you .bubble { background: #2563eb; color: white; }
    .msg.bot .bubble { background: #e5e7eb; color: black; }
    .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ccc; }
    .composer input { flex: 1; padding: 8px; font-size: 16px; }
    .composer button { padding: 8px 12px; font-size: 16px; }
    pre { white-space: pre-wrap; word-wrap: break-word; background: #11182710; padding: 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div><strong>Stellarc Dynamic</strong></div>
    <div style="margin-top:8px; font-size: 12px; opacity: .8;">Send a directive; results will appear inline.</div>
    <div style="margin-top:12px; font-size: 12px;">
      Example:
      <div>Build and deploy a simple web service to Azure with a monetization plan</div>
    </div>
  </div>
  <div class="main">
    <div class="header">Chat</div>
    <div id="chat" class="chat"></div>
    <div class="composer">
      <input id="input" type="text" placeholder="Type a directive..." />
      <button id="send">Send</button>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
